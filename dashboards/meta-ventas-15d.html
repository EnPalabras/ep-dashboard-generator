<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta: Ventas Diarias — 15 días</title>
  <link rel="stylesheet" href="/assets/dashboard-base.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { background: #f1f5f9; text-align: left; padding: 10px 12px; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; }
    td { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .tag-good { color: #16a34a; font-weight: 600; }
    .tag-bad  { color: #dc2626; font-weight: 600; }
    tfoot td { font-weight: 700; background: #f8fafc; border-top: 2px solid #e2e8f0; }
  </style>
</head>
<body>
  <nav class="back"><a href="/">← Todos los dashboards</a></nav>
  <h1>Meta: Ventas Diarias — Últimos 15 días</h1>

  <div class="grid" id="kpis"></div>

  <div class="card">
    <h2>Conversiones y gasto por día</h2>
    <div class="chart-container">
      <canvas id="mainChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>CTR y CAC por día</h2>
    <div class="chart-container">
      <canvas id="ratesChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Detalle por día</h2>
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th class="num">Gasto</th>
          <th class="num">Conversiones</th>
          <th class="num">CTR</th>
          <th class="num">CAC</th>
          <th class="num">Clicks</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot id="tableFoot"></tfoot>
    </table>
  </div>

  <script>
    const API_BASE = window.location.origin;

    function daysAgo(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return d.toISOString().slice(0, 10);
    }

    function fmt$(n) {
      return '$' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtN(n) {
      return Number(n).toLocaleString('es-AR');
    }

    function fmtPct(n) {
      return Number(n).toFixed(2) + '%';
    }

    function fmtDate(iso) {
      const [, m, d] = iso.split('-');
      return `${d}/${m}`;
    }

    async function main() {
      const from = daysAgo(15);
      const res = await fetch(`${API_BASE}/api/meta/daily?from=${from}`);
      if (!res.ok) throw new Error(`Error API: ${res.status}`);
      const raw = await res.json();

      const data = [...raw].sort((a, b) => a.date.localeCompare(b.date));

      // Totales
      const totals = data.reduce((acc, r) => ({
        spend:       acc.spend       + Number(r.spend),
        conversions: acc.conversions + Number(r.conversions),
        clicks:      acc.clicks      + Number(r.clicks),
        impressions: acc.impressions + Number(r.impressions),
      }), { spend: 0, conversions: 0, clicks: 0, impressions: 0 });

      const ctr = totals.impressions > 0 ? totals.clicks / totals.impressions * 100 : 0;
      const cac = totals.conversions > 0 ? totals.spend / totals.conversions : 0;

      // KPIs resumen
      document.getElementById('kpis').innerHTML = [
        { label: 'Gasto total',     value: fmt$(totals.spend) },
        { label: 'Conversiones',    value: fmtN(totals.conversions) },
        { label: 'CTR promedio',    value: fmtPct(ctr) },
        { label: 'CAC promedio',    value: fmt$(cac) },
      ].map(k => `
        <div class="card metric">
          <div class="value">${k.value}</div>
          <div class="label">${k.label}</div>
        </div>
      `).join('');

      // Tabla
      const tbody = document.getElementById('tableBody');
      const avgConv = totals.conversions / data.length;

      tbody.innerHTML = data.map(r => {
        const spend = Number(r.spend);
        const conv  = Number(r.conversions);
        const ctr_d = Number(r.ctr);
        const cac_d = conv > 0 ? spend / conv : null;
        const convClass = conv >= avgConv ? 'tag-good' : 'tag-bad';

        return `<tr>
          <td>${fmtDate(r.date)}</td>
          <td class="num">${fmt$(spend)}</td>
          <td class="num ${convClass}">${fmtN(conv)}</td>
          <td class="num">${fmtPct(ctr_d)}</td>
          <td class="num">${cac_d !== null ? fmt$(cac_d) : '—'}</td>
          <td class="num">${fmtN(r.clicks)}</td>
        </tr>`;
      }).join('');

      document.getElementById('tableFoot').innerHTML = `<tr>
        <td>Total / Prom.</td>
        <td class="num">${fmt$(totals.spend)}</td>
        <td class="num">${fmtN(totals.conversions)}</td>
        <td class="num">${fmtPct(ctr)}</td>
        <td class="num">${fmt$(cac)}</td>
        <td class="num">${fmtN(totals.clicks)}</td>
      </tr>`;

      // Gráfico 1: conversiones + gasto
      new Chart(document.getElementById('mainChart'), {
        type: 'bar',
        data: {
          labels: data.map(r => fmtDate(r.date)),
          datasets: [
            {
              label: 'Gasto ($)',
              data: data.map(r => Number(r.spend)),
              backgroundColor: 'rgba(99, 102, 241, 0.75)',
              yAxisID: 'y',
            },
            {
              label: 'Conversiones',
              data: data.map(r => Number(r.conversions)),
              type: 'line',
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              yAxisID: 'y1',
              tension: 0.3,
              pointRadius: 4,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y:  { position: 'left',  title: { display: true, text: 'Gasto ($)' } },
            y1: { position: 'right', title: { display: true, text: 'Conversiones' }, grid: { drawOnChartArea: false } },
          },
        },
      });

      // Gráfico 2: CTR + CAC
      const cacData = data.map(r => {
        const s = Number(r.spend), c = Number(r.conversions);
        return c > 0 ? s / c : null;
      });

      new Chart(document.getElementById('ratesChart'), {
        type: 'line',
        data: {
          labels: data.map(r => fmtDate(r.date)),
          datasets: [
            {
              label: 'CTR (%)',
              data: data.map(r => Number(r.ctr)),
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.1)',
              yAxisID: 'y',
              tension: 0.3,
              pointRadius: 4,
            },
            {
              label: 'CAC ($)',
              data: cacData,
              borderColor: '#ef4444',
              backgroundColor: 'rgba(239, 68, 68, 0.1)',
              yAxisID: 'y1',
              tension: 0.3,
              pointRadius: 4,
              spanGaps: true,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y:  { position: 'left',  title: { display: true, text: 'CTR (%)' } },
            y1: { position: 'right', title: { display: true, text: 'CAC ($)' }, grid: { drawOnChartArea: false } },
          },
        },
      });
    }

    main().catch(err => {
      document.getElementById('kpis').innerHTML =
        `<div class="card"><p>Error al cargar datos: ${err.message}</p></div>`;
    });
  </script>
</body>
</html>
