name: Fetch Ad Data

on:
  # Schedule pausado: el intake propio de Meta/GA4 (que escribía a la DB vieja gondola)
  # quedó redundante — la DB única (server_en_palabras) ya tiene esos datos por sus
  # propios crons. Reactivar cuando se migre el intake acá (Fase 2). Trigger manual disponible.
  # schedule:
  #   - cron: "0 */12 * * *"
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
  GA_PROJECT_ID: ${{ secrets.GA_PROJECT_ID }}
  GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
  GA_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GA_SERVICE_ACCOUNT_EMAIL }}
  GA_PRIVATE_KEY: ${{ secrets.GA_PRIVATE_KEY }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run src/batch/run.ts
